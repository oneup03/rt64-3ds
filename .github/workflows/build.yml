# Builds the toolchain probe (tests/toolchain) in devkitPro's image, which
# exercises the CMake toolchain file and the libraries' compile flags. Game
# builds happen in the game repositories, which include this one.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  probe:
    name: Toolchain probe (Nintendo 3DS)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    # Container jobs run steps under sh unless told otherwise, and sh rejects
    # `set -o pipefail` (actions/runner#1533).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          set -euo pipefail
          cmake -S tests/toolchain -B build/toolchain -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/devkitARM-3ds.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/toolchain
          ls -l build/toolchain/fenv_test.3dsx
      - uses: actions/upload-artifact@v4
        with:
          name: fenv_test
          path: build/toolchain/fenv_test.3dsx
          retention-days: 7
